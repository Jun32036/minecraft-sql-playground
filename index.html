<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用 Minecraft 的生物、物品與玩家資料闖 30 關，在瀏覽器裡直接寫 SQL。">
<title>礦工 SQL 學院</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* layout: a strip of 30 level blocks across the top (6 chapters = 6 pickaxe tiers); below it, lesson on the left, workbench (editor + results) on the right; table reference underneath */
:root {
  --ground: #E7EDE8;
  --surface: #FBFCFA;
  --ink: #17231E;
  --muted: #55665D;
  --line: #C9D4CC;
  --accent: #0B7A53;
  --on-accent: #FFFFFF;
  --accent-soft: #D4EDE0;
  --gold: #8F6100;
  --gold-soft: #F5E8C4;
  --bad: #B3261E;
  --bad-soft: #F9E0DC;
  --code-bg: #13201B;
  --code-ink: #DCEBE3;
  --code-line: #2C4037;
  --font-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Noto Sans TC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1411; --surface: #17211C; --ink: #E4EDE7; --muted: #94A69C; --line: #2B3B33;
    --accent: #4FD39A; --on-accent: #05241A; --accent-soft: #14382A;
    --gold: #E3B341; --gold-soft: #3A2F10; --bad: #FF8A80; --bad-soft: #47201C;
    --code-bg: #090F0C; --code-ink: #DCEBE3; --code-line: #26372F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1411; --surface: #17211C; --ink: #E4EDE7; --muted: #94A69C; --line: #2B3B33;
  --accent: #4FD39A; --on-accent: #05241A; --accent-soft: #14382A;
  --gold: #E3B341; --gold-soft: #3A2F10; --bad: #FF8A80; --bad-soft: #47201C;
  --code-bg: #090F0C; --code-ink: #DCEBE3; --code-line: #26372F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
p, h1, h2, h3, ul, pre { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }

.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1.2; }
.brand small { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.prog { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 150px; height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }

.map { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; }
.chap { display: flex; flex-direction: column; gap: 6px; }
.chap span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.chap div { display: flex; gap: 5px; }
.lv { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 3px; background: var(--ground); color: var(--muted); font-family: var(--font-mono); font-size: 13px; padding: 0; }
.lv:hover { border-color: var(--accent); color: var(--ink); }
.lv.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.lv.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--gold); color: var(--ink); }
.lv.done.cur { color: var(--on-accent); }
.free { margin-left: auto; height: 34px; padding: 0 14px; border: 1px dashed var(--muted); border-radius: 3px; background: transparent; color: var(--ink); font-size: 14px; }
.free.cur { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
.lesson, .bench { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 0.04em; }
.lesson h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.3; text-wrap: balance; }
.story { color: var(--muted); font-size: 15px; }
.teach { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.teach pre, .answer pre { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; background: var(--code-bg); color: var(--code-ink); border-radius: 5px; padding: 12px 14px; overflow-x: auto; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; }
.kw li { font-size: 13px; border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; background: var(--surface); }
.kw b { font-family: var(--font-mono); font-weight: 600; color: var(--accent); margin-right: 6px; }
.task { background: var(--gold-soft); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.task h2 { font-size: 13px; color: var(--gold); letter-spacing: 0.04em; }
.task p { font-size: 15.5px; }
.task code { background: var(--surface); }
.uses { font-size: 13px; color: var(--muted); }
.uses button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-family: var(--font-mono); font-size: 13px; }

.editor { background: var(--code-bg); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
.editor label { font-size: 12px; color: var(--code-ink); opacity: 0.7; padding: 8px 14px 0; font-family: var(--font-mono); }
#sql { width: 100%; min-height: 150px; resize: vertical; border: 0; outline: 0; background: transparent; color: var(--code-ink); font-family: var(--font-mono); font-size: 15px; line-height: 1.65; padding: 8px 14px 12px; tab-size: 2; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--code-line); align-items: center; }
.btn { border: 1px solid var(--code-line); background: transparent; color: var(--code-ink); border-radius: 4px; padding: 6px 13px; font-size: 14px; }
.btn:hover { border-color: var(--code-ink); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; padding: 6px 20px; }
.btn.go:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.5; cursor: default; }
.keytip { margin-left: auto; font-size: 12px; color: var(--code-ink); opacity: 0.6; font-family: var(--font-mono); }

.verdict { border-radius: 6px; padding: 12px 16px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.verdict.ok { background: var(--accent-soft); color: var(--ink); border-left: 5px solid var(--accent); }
.verdict.no { background: var(--bad-soft); color: var(--ink); border-left: 5px solid var(--bad); }
.verdict.info { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.verdict b { font-weight: 700; }
.verdict .mono { font-family: var(--font-mono); font-size: 13px; display: block; color: var(--muted); overflow-wrap: anywhere; }
.next { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 4px; padding: 7px 16px; font-weight: 700; font-size: 14px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.note h3 { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }

.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.res { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.res h3 { font-size: 13px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.scroll { overflow: auto; max-height: 340px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--ground); font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; }
tr:last-child td { border-bottom: 0; }
td.null { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.empty { padding: 14px; font-size: 14px; color: var(--muted); }

.ref { display: flex; flex-direction: column; gap: 12px; }
.ref h2 { font-family: var(--font-display); font-size: 22px; }
.ref > p { font-size: 14px; color: var(--muted); }
.tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.tbl.used { border-color: var(--gold); }
.tbl summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tbl summary b { font-family: var(--font-mono); font-size: 15px; }
.tbl summary span { font-size: 13px; color: var(--muted); }
.cols { list-style: none; padding: 0; margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; }
.cols b { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.cols span { color: var(--muted); }
.tbl .scroll { margin-top: 10px; max-height: 260px; }

.foot { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.foot button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 5px 12px; font-size: 13px; }
@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .brand { font-size: 26px; }
  .lesson h1 { font-size: 24px; }
  .free { margin-left: 0; }
  .keytip { display: none; }
}
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <p class="brand">礦工 SQL 學院<small>用 Minecraft 的生物、物品和玩家資料，一關一關學會 SQL 查詢</small></p>
    <div class="prog">
      <span id="progText">已過 0 / 30 關</span>
      <div class="bar" id="progBar" role="progressbar" aria-label="過關進度" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><i></i></div>
    </div>
  </header>

  <nav class="map" id="map" aria-label="關卡地圖"></nav>

  <div class="stage">
    <section class="lesson" id="lesson" aria-live="polite"></section>
    <section class="bench" aria-label="工作台">
      <div class="editor">
        <label for="sql">在這裡寫 SQL</label>
        <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <div class="tools">
          <button type="button" class="btn go" id="runBtn" disabled>載入中…</button>
          <button type="button" class="btn" id="hintBtn">提示</button>
          <button type="button" class="btn" id="ansBtn">看答案</button>
          <button type="button" class="btn" id="clearBtn">重寫</button>
          <span class="keytip">Ctrl / ⌘ + Enter 執行</span>
        </div>
      </div>
      <div id="verdict" class="verdict info" role="status">寫好 SQL 後按「執行」，系統會把你的結果和預期結果比對。</div>
      <div id="extra"></div>
      <div class="results" id="results"></div>
    </section>
  </div>

  <section class="ref" aria-labelledby="refTitle">
    <h2 id="refTitle">資料表圖鑑</h2>
    <p>伺服器上有 7 張資料表。點開可以看欄位說明和全部資料。金色外框是這一關會用到的表。</p>
    <div class="tables" id="tables"></div>
  </section>

  <footer class="foot">
    <span>非官方學習網站，與 Mojang、Microsoft 無關。闖關設計參考「SQL 之母」。玩家與挖礦紀錄是虛構的練習資料。</span>
    <span id="saveState" role="status">進度存在這台裝置的瀏覽器裡。</span>
    <button type="button" id="resetBtn">清除全部進度</button>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js"></script>

var TABLES = [
  { name: "mobs", zh: "生物", cols: [["id","編號"],["name","名稱"],["type","類型：敵對、中立、友善"],["health","血量（2 點 = 1 顆心）"],["damage","攻擊力，不會攻擊的是 NULL"],["dimension","出沒的維度"],["xp","擊敗後掉落的經驗值"]] },

var LEVELS = [
{ t: "打開生物圖鑑", kw: [["select","選取"],["from","從哪張表"]], tables: ["mobs"],
  story: "你剛進入伺服器，手上只有一把木鎬。先翻開生物圖鑑，看看這個世界有哪些生物。",
  teach: "<p>查資料的基本句型是「選什麼欄位、從哪張表」。星號 <code>*</code> 代表全部欄位。</p><pre>SELECT * FROM items;</pre><p>這句會列出物品表的每一欄、每一列。SQL 關鍵字大小寫都可以。</p>",
  task: "查出生物表 <code>mobs</code> 的全部資料。", hint: "把範例裡的 items 換成 mobs。", ans: "SELECT * FROM mobs;" },
{ t: "只看需要的欄位", kw: [["column","欄位"]], tables: ["mobs"],

  teach: "<p>把 <code>*</code> 換成欄位名稱，用逗號隔開，就只會顯示那幾欄。</p><pre>SELECT name, category FROM items;</pre>",
  task: "查出每種生物的名稱 <code>name</code> 和血量 <code>health</code>。", hint: "SELECT 後面寫 name, health。", ans: "SELECT name, health FROM mobs;" },
{ t: "幫欄位取中文名字", kw: [["as","當作"],["alias","別名"]], tables: ["mobs"],
  story: "隊友看不懂英文欄位。你決定把結果的標題換成中文再貼到公告欄。",
  teach: "<p>在欄位後面加 <code>AS 新名字</code>，結果的標題就會換掉。資料表本身不會被改。</p><pre>SELECT name AS 物品, max_stack AS 堆疊上限 FROM items;</pre>",
  task: "查出生物的 <code>name</code> 和 <code>health</code>，標題分別改成 <code>名稱</code> 和 <code>血量</code>。", hint: "name AS 名稱, health AS 血量", ans: "SELECT name AS 名稱, health AS 血量 FROM mobs;" },
{ t: "血量換算成愛心", kw: [["value","值"],["calculate","計算"]], tables: ["mobs"],
  story: "遊戲畫面上的血條是一顆一顆的愛心，每顆愛心等於 2 點血量。",
  teach: "<p>SELECT 裡可以直接做加減乘除，算出來的結果會變成新的一欄。記得用 AS 幫它取名字。</p><pre>SELECT name, max_stack * 27 AS chest_total FROM items;</pre><p>這句算出一個小箱子（27 格）最多能放幾個。</p>",
  task: "查出生物的 <code>name</code>，以及血量除以 2 的愛心數，欄位取名 <code>hearts</code>。", hint: "health / 2 AS hearts", ans: "SELECT name, health / 2 AS hearts FROM mobs;" },
{ t: "只找敵對生物", kw: [["where","條件"]], tables: ["mobs"],
  story: "你升級成石鎬了。天快黑了，你想知道晚上哪些生物會主動攻擊你。",
  teach: "<p><code>WHERE</code> 放在 FROM 後面，只留下符合條件的列。文字要用單引號包起來。</p><pre>SELECT name, max_stack FROM items WHERE category = '食物';</pre>",
  task: "查出類型 <code>type</code> 是 <code>敵對</code> 的生物，顯示 <code>name</code> 和 <code>health</code>。", hint: "WHERE type = '敵對'", ans: "SELECT name, health FROM mobs WHERE type = '敵對';" },
{ t: "血量在範圍內的生物", kw: [["between","在…之間"],["and","而且"]], tables: ["mobs"],
  story: "你的鐵劍適合對付血量中等的對手。太弱的沒意思，太強的打不過。",
  teach: "<p>比較大小可以用 <code>&gt;</code>、<code>&lt;</code>、<code>&gt;=</code>、<code>&lt;=</code>、<code>&lt;&gt;</code>（不等於）。要表示一段範圍，用 <code>BETWEEN 小 AND 大</code>，頭尾都包含。</p><pre>SELECT name, durability FROM items WHERE durability BETWEEN 200 AND 400;</pre>",
  task: "查出血量在 20 到 40 之間（含 20 和 40）的生物，顯示 <code>name</code> 和 <code>health</code>。", hint: "WHERE health BETWEEN 20 AND 40", ans: "SELECT name, health FROM mobs WHERE health BETWEEN 20 AND 40;" },
{ t: "不會攻擊的生物", kw: [["null","空值"],["is","是"]], tables: ["mobs"],
  story: "牧場需要動物。你要找出攻擊力那一格是空白的生物，牠們不會還手。",
  teach: "<p>空白的格子叫 <code>NULL</code>，意思是「沒有值」。它不能用等號比，要寫 <code>IS NULL</code> 或 <code>IS NOT NULL</code>。</p><pre>SELECT name FROM items WHERE durability IS NOT NULL;</pre><p>這句找出有耐久度的物品。</p>",
  task: "查出攻擊力 <code>damage</code> 是空值的生物，顯示 <code>name</code> 和 <code>type</code>。", hint: "WHERE damage IS NULL", ans: "SELECT name, type FROM mobs WHERE damage IS NULL;" },
{ t: "名字裡有鑽石的物品", kw: [["like","像（模糊比對）"]], tables: ["items"],
  story: "你終於挖到鑽石，想查查它能做成哪些東西。",
  teach: "<p><code>LIKE</code> 用來比對文字的一部分。<code>%</code> 代表任意長度的任何字。</p><pre>SELECT name FROM mobs WHERE name LIKE '%骷髏';</pre><p>這句找出名字以「骷髏」結尾的生物。<code>'%骷髏%'</code> 則是名字裡任何位置有「骷髏」。</p>",
  task: "查出名稱裡含有「鑽石」的物品，顯示 <code>name</code> 和 <code>category</code>。", hint: "WHERE name LIKE '%鑽石%'", ans: "SELECT name, category FROM items WHERE name LIKE '%鑽石%';" },
{ t: "危險名單", kw: [["and","而且"],["or","或者"],["not","不是"]], tables: ["mobs"],
  story: "遠征隊要一份危險名單：地獄裡的敵對生物，再加上所有血量破百的大傢伙。",
  teach: "<p>多個條件用 <code>AND</code>（都要成立）或 <code>OR</code>（一個成立就好）串起來。混用時加括號，才不會算錯順序。</p><pre>SELECT name FROM items\nWHERE (category = '武器' AND durability > 300) OR max_stack = 16;</pre>",
  task: "查出「維度是 <code>地獄</code> 而且類型是 <code>敵對</code>」或者「血量大於等於 100」的生物，顯示 <code>name</code>、<code>dimension</code>、<code>health</code>。", hint: "WHERE (dimension = '地獄' AND type = '敵對') OR health >= 100", ans: "SELECT name, dimension, health FROM mobs WHERE (dimension = '地獄' AND type = '敵對') OR health >= 100;" },
{ t: "有哪些組合", kw: [["distinct","不重複"]], tables: ["mobs"],
  story: "鐵鎬到手。你想整理一張總表：每個維度各有哪幾種類型的生物，重複的只列一次。",
  teach: "<p><code>DISTINCT</code> 寫在 SELECT 後面，會把重複的列合成一列。寫兩個欄位時，是看兩欄的組合有沒有重複。</p><pre>SELECT DISTINCT category FROM items;</pre>",
  task: "查出生物表裡不重複的 <code>dimension</code> 和 <code>type</code> 組合。", hint: "SELECT DISTINCT dimension, type", ans: "SELECT DISTINCT dimension, type FROM mobs;" },
{ t: "血量排行榜", kw: [["order by","依…排序"],["asc","由小到大"],["desc","由大到小"]], tables: ["mobs"], ordered: true,
  story: "公會要貼一張生物血量排行榜，最硬的排最上面。",
  teach: "<p><code>ORDER BY</code> 放在句子最後面，決定列的順序。預設由小到大（ASC），加 <code>DESC</code> 變成由大到小。可以寫多個欄位，前面的相同時才比後面的。</p><pre>SELECT name, durability FROM items\nWHERE durability IS NOT NULL\nORDER BY durability DESC, id ASC;</pre>",
  task: "查出生物的 <code>id</code>、<code>name</code>、<code>health</code>，依血量由高到低排；血量相同時 <code>id</code> 小的在前。", hint: "ORDER BY health DESC, id ASC", ans: "SELECT id, name, health FROM mobs ORDER BY health DESC, id ASC;" },
{ t: "等級前三名", kw: [["limit","限制筆數"],["offset","跳過幾筆"]], tables: ["players"], ordered: true,
  story: "伺服器要頒獎給等級最高的三位玩家。",
  teach: "<p><code>LIMIT 數字</code> 只取前幾列，通常和 ORDER BY 一起用。<code>LIMIT 3 OFFSET 2</code> 是跳過前 2 列再取 3 列。</p><pre>SELECT name, durability FROM items\nORDER BY durability DESC\nLIMIT 2;</pre>",
  task: "查出等級最高的 3 位玩家，顯示 <code>name</code> 和 <code>level</code>，等級高的在前。", hint: "ORDER BY level DESC LIMIT 3", ans: "SELECT name, level FROM players ORDER BY level DESC LIMIT 3;" },
{ t: "幫生物分級", kw: [["case","情況"],["when","當…"],["then","就…"],["else","否則"]], tables: ["mobs"],
  story: "新手看數字沒感覺。你決定把生物分成三級，一眼就知道好不好打。",
  teach: "<p><code>CASE WHEN 條件 THEN 結果 … ELSE 結果 END</code> 會依條件給出不同的值，從上往下比，先符合的先算。</p><pre>SELECT name,\n  CASE WHEN max_stack = 1 THEN '不能疊'\n       WHEN max_stack = 16 THEN '疊 16'\n       ELSE '疊 64' END AS stack_type\nFROM items;</pre>",
  task: "查出生物的 <code>name</code>、<code>health</code>，再加一欄 <code>tier</code>：血量 100 以上是 <code>首領級</code>，20 以上是 <code>普通</code>，其他是 <code>脆皮</code>。", hint: "CASE WHEN health >= 100 THEN '首領級' WHEN health >= 20 THEN '普通' ELSE '脆皮' END AS tier", ans: "SELECT name, health,\n  CASE WHEN health >= 100 THEN '首領級'\n       WHEN health >= 20 THEN '普通'\n       ELSE '脆皮' END AS tier\nFROM mobs;" },
{ t: "哪個月加入的", kw: [["date","日期"],["function","函數"]], tables: ["players"],
  story: "管理員想知道每位玩家是哪一個月加入伺服器的。",
  teach: "<p>函數會把一個值加工成另一個值。<code>strftime('格式', 日期)</code> 可以從日期取出想要的部分：<code>%Y</code> 是年、<code>%m</code> 是月、<code>%d</code> 是日。</p><pre>SELECT mined_on, strftime('%d', mined_on) AS day FROM mining_log;</pre>",
  task: "查出玩家的 <code>name</code>、<code>joined_date</code>，再加一欄 <code>join_month</code>，格式是年-月，例如 <code>2025-01</code>。", hint: "strftime('%Y-%m', joined_date) AS join_month", ans: "SELECT name, joined_date, strftime('%Y-%m', joined_date) AS join_month FROM players;" },
{ t: "製作生物名牌", kw: [["length","長度"],["text","文字"]], tables: ["mobs"],
  story: "你要幫動物園的每個圍欄做名牌，需要知道名字有幾個字，還要印上類型。",
  teach: "<p><code>length(文字)</code> 算出字數。兩條直線 <code>||</code> 可以把文字接在一起。</p><pre>SELECT name, length(name) AS name_len, '【' || category || '】' AS tag FROM items;</pre>",
  task: "查出生物的 <code>name</code>、名字字數 <code>name_len</code>，以及把類型後面接上「生物」兩個字的 <code>label</code>（例如 <code>敵對生物</code>）。", hint: "length(name) AS name_len, type || '生物' AS label", ans: "SELECT name, length(name) AS name_len, type || '生物' AS label FROM mobs;" },
{ t: "敵對生物總覽", kw: [["count","計數"],["sum","加總"],["average (avg)","平均"],["max / min","最大 / 最小"]], tables: ["mobs"],
  story: "金鎬時代。你不想再一列一列看，只想要幾個總結數字。",
  teach: "<p>聚合函數把很多列算成一個數字：<code>COUNT(*)</code> 算列數、<code>SUM</code> 加總、<code>AVG</code> 平均、<code>MAX</code> 最大、<code>MIN</code> 最小。</p><pre>SELECT COUNT(*) AS total, MAX(durability) AS best FROM items WHERE category = '武器';</pre>",
  task: "針對類型是 <code>敵對</code> 的生物，算出數量 <code>total</code>、最高血量 <code>max_health</code>、平均血量 <code>avg_health</code>。", hint: "SELECT COUNT(*) AS total, MAX(health) AS max_health, AVG(health) AS avg_health … WHERE type = '敵對'", ans: "SELECT COUNT(*) AS total, MAX(health) AS max_health, AVG(health) AS avg_health FROM mobs WHERE type = '敵對';" },
{ t: "每種類型有幾隻", kw: [["group by","依…分組"]], tables: ["mobs"],
  story: "圖鑑封面要印一行統計：敵對、中立、友善各有幾種生物。",
  teach: "<p><code>GROUP BY 欄位</code> 會把那一欄相同的列分成一組，聚合函數就會每一組各算一次。</p><pre>SELECT category, COUNT(*) AS item_count FROM items GROUP BY category;</pre>",
  task: "算出每種 <code>type</code> 各有幾種生物，數量欄位取名 <code>mob_count</code>。", hint: "SELECT type, COUNT(*) AS mob_count FROM mobs GROUP BY type", ans: "SELECT type, COUNT(*) AS mob_count FROM mobs GROUP BY type;" },
{ t: "維度加類型一起分", kw: [["group","分組"]], tables: ["mobs"],
  story: "遠征隊想看得更細：每個維度裡，每種類型有幾種生物，其中最硬的血量是多少。",
  teach: "<p>GROUP BY 後面可以寫多個欄位，兩欄都相同的列才會被分在同一組。</p><pre>SELECT category, max_stack, COUNT(*) AS item_count\nFROM items\nGROUP BY category, max_stack;</pre>",
  task: "依 <code>dimension</code> 和 <code>type</code> 分組，算出數量 <code>mob_count</code> 和最高血量 <code>max_health</code>。", hint: "GROUP BY dimension, type", ans: "SELECT dimension, type, COUNT(*) AS mob_count, MAX(health) AS max_health FROM mobs GROUP BY dimension, type;" },
{ t: "挖礦達人", kw: [["having","分組後的條件"]], tables: ["mining_log"],
  story: "公會要發「挖礦達人」徽章給累計挖到 50 個以上礦石的玩家。",
  teach: "<p>WHERE 是分組之前篩選每一列；<code>HAVING</code> 是分組之後篩選每一組，所以可以用聚合函數當條件。</p><pre>SELECT category, COUNT(*) AS item_count\nFROM items\nGROUP BY category\nHAVING COUNT(*) >= 4;</pre>",
  task: "從挖礦紀錄算出每位玩家的總挖礦量 <code>total_mined</code>，只留下總量大於等於 50 的，顯示 <code>player_id</code> 和 <code>total_mined</code>。", hint: "GROUP BY player_id HAVING SUM(quantity) >= 50", ans: "SELECT player_id, SUM(quantity) AS total_mined FROM mining_log GROUP BY player_id HAVING SUM(quantity) >= 50;" },
{ t: "首領挑戰表", kw: [["cross join","交叉連接"]], tables: ["players", "mobs"],
  story: "鑽石鎬到手，可以開始把不同的表接在一起。遠征隊的每位成員都要挑戰每一隻首領，請排出所有對戰組合。",
  teach: "<p><code>CROSS JOIN</code> 把左表的每一列和右表的每一列都配一次。兩張表有同名欄位時，在前面加表名或簡稱來區分，例如 <code>p.name</code>。</p><pre>SELECT b.name AS biome, i.name AS tool\nFROM biomes b CROSS JOIN items i\nWHERE b.dimension = '地獄' AND i.category = '工具';</pre>",
  task: "列出公會是 <code>遠征隊</code> 的玩家和血量大於等於 200 的生物的所有組合，顯示玩家名稱 <code>player</code> 和生物名稱 <code>boss</code>。", hint: "FROM players p CROSS JOIN mobs m WHERE p.guild = '遠征隊' AND m.health >= 200", ans: "SELECT p.name AS player, m.name AS boss FROM players p CROSS JOIN mobs m WHERE p.guild = '遠征隊' AND m.health >= 200;" },
{ t: "玩家住在哪裡", kw: [["inner join","內連接"],["on","對應條件"]], tables: ["players", "biomes"],
  story: "玩家表只記了基地的生態域編號。你想直接看到生態域的名字。",
  teach: "<p><code>JOIN … ON</code> 依照對應條件把兩張表的列接起來，只留下兩邊對得上的列。</p><pre>SELECT m.name AS mob, i.name AS item\nFROM mob_drops d\nJOIN mobs m ON d.mob_id = m.id\nJOIN items i ON d.item_id = i.id;</pre><p>這句把掉落物表的編號換成生物和物品的名字。</p>",
  task: "查出每位玩家的名稱 <code>player</code>、基地生態域名稱 <code>biome</code>，以及該生態域的 <code>dimension</code>。", hint: "FROM players p JOIN biomes b ON p.biome_id = b.id", ans: "SELECT p.name AS player, b.name AS biome, b.dimension FROM players p JOIN biomes b ON p.biome_id = b.id;" },
{ t: "沒人住的生態域", kw: [["left join","左外連接"],["outer","外部"]], tables: ["biomes", "players"],
  story: "管理員想看每個生態域住了誰，沒人住的也要列出來，方便招募新居民。",
  teach: "<p><code>LEFT JOIN</code> 會保留左表的每一列。右表對不上的地方，欄位會是 NULL。</p><pre>SELECT m.name AS mob, d.item_id\nFROM mobs m LEFT JOIN mob_drops d ON d.mob_id = m.id;</pre><p>沒有掉落物紀錄的生物也會出現，item_id 是 NULL。</p>",
  task: "列出每個生態域的名稱 <code>biome</code> 和住在那裡的玩家名稱 <code>player</code>。沒人住的生態域也要出現，<code>player</code> 是空值。", hint: "FROM biomes b LEFT JOIN players p ON p.biome_id = b.id", ans: "SELECT b.name AS biome, p.name AS player FROM biomes b LEFT JOIN players p ON p.biome_id = b.id;" },
{ t: "比平均還硬的生物", kw: [["subquery","子查詢"]], tables: ["mobs"],
  story: "你想知道哪些生物的血量高過全體平均，但你不知道平均是多少。",
  teach: "<p>括號裡可以再放一句查詢，叫子查詢。它先算出結果，外面那句再拿來用。</p><pre>SELECT name, durability FROM items\nWHERE durability > (SELECT AVG(durability) FROM items);</pre>",
  task: "查出血量高於全部生物平均血量的生物，顯示 <code>name</code> 和 <code>health</code>。", hint: "WHERE health > (SELECT AVG(health) FROM mobs)", ans: "SELECT name, health FROM mobs WHERE health > (SELECT AVG(health) FROM mobs);" },
{ t: "從沒挖過礦的玩家", kw: [["exists","存在"]], tables: ["players", "mining_log"],
  story: "公會想送一把石鎬給從來沒挖過礦的玩家，鼓勵他們下礦坑。",
  teach: "<p><code>EXISTS (子查詢)</code> 檢查子查詢有沒有查到東西。<code>NOT EXISTS</code> 則是查不到才成立。子查詢裡可以用到外面那張表的欄位。</p><pre>SELECT name FROM mobs m\nWHERE EXISTS (SELECT 1 FROM mob_drops d WHERE d.mob_id = m.id);</pre><p>這句找出有掉落物紀錄的生物。</p>",
  task: "查出在挖礦紀錄裡一筆都沒有的玩家，顯示 <code>name</code> 和 <code>level</code>。", hint: "WHERE NOT EXISTS (SELECT 1 FROM mining_log m WHERE m.player_id = p.id)", ans: "SELECT name, level FROM players p WHERE NOT EXISTS (SELECT 1 FROM mining_log m WHERE m.player_id = p.id);" },
{ t: "終界遠征手冊", kw: [["union","合併結果"],["union all","合併且保留重複"]], tables: ["mobs", "items"],
  story: "出發去終界之前，你要把「會遇到的生物」和「要帶的裝備」整理成同一張清單。",
  teach: "<p><code>UNION ALL</code> 把兩句查詢的結果上下接在一起，兩邊的欄位數量要一樣。<code>UNION</code> 會順便去掉重複的列。</p><pre>SELECT name, '玩家' AS kind FROM players WHERE level >= 50\nUNION ALL\nSELECT name, '生態域' FROM biomes WHERE dimension = '地獄';</pre>",
  task: "把維度是 <code>終界</code> 的生物（<code>kind</code> 填 <code>生物</code>）和分類是 <code>裝備</code> 的物品（<code>kind</code> 填 <code>物品</code>）合成一張表，欄位是 <code>name</code> 和 <code>kind</code>。", hint: "SELECT name, '生物' AS kind FROM mobs WHERE … UNION ALL SELECT name, '物品' FROM items WHERE …", ans: "SELECT name, '生物' AS kind FROM mobs WHERE dimension = '終界'\nUNION ALL\nSELECT name, '物品' FROM items WHERE category = '裝備';" },
{ t: "各維度的血量總和", kw: [["over","在…範圍內"],["partition by","依…分區"],["window","視窗（開窗）"]], tables: ["mobs"],
  story: "最後一把鎬：獄髓鎬。你想在每隻生物旁邊，同時看到牠所在維度的血量總和。",

});
$("hintBtn").addEventListener("click", function () { if (state.cur >= 0) note("提示", LEVELS[state.cur].hint); });
$("ansBtn").addEventListener("click", function () { if (state.cur >= 0) note("參考答案（先自己試過再看，寫法不只一種）", LEVELS[state.cur].ans, true); });
$("clearBtn").addEventListener("click", function () { $("sql").value = ""; $("sql").focus(); });
var armed = false, armTimer = null;
$("resetBtn").addEventListener("click", function () {
  var b = $("resetBtn");
  if (!armed) { armed = true; b.textContent = "再按一次確認清除"; armTimer = setTimeout(function () { armed = false; b.textContent = "清除全部進度"; }, 4000); return; }
  clearTimeout(armTimer); armed = false; b.textContent = "清除全部進度";
  state = { done: {}, drafts: {}, cur: 0, resetAt: Date.now() }; persist(); pushRemote(); $("sql").value = ""; renderAll();
});

renderAll();
startSync();
if (typeof initSqlJs === "function") {
  initSqlJs().then(function (lib) {
    SQL = lib;
    $("runBtn").disabled = false; $("runBtn").textContent = "執行";
    if (state.cur >= 0) { $("results").textContent = ""; $("results").appendChild(resBlock("預期結果", expected(state.cur))); }
  }).catch(function () { setVerdict("no", ["SQL 引擎載入失敗。請重新整理頁面再試一次。"]); $("runBtn").textContent = "無法執行"; });
} else {
  setVerdict("no", ["SQL 引擎載入失敗。請檢查網路後重新整理頁面。"]); $("runBtn").textContent = "無法執行";
}
</script>
</body>
</html>
